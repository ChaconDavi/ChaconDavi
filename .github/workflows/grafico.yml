name: Grafico de contribuicoes

# Gera o mapa de calor do perfil em casa, em vez de embutir imagem de servico
# de terceiro. Motivo: em 26/08/2026 os tres servicos usados para isso
# responderam 503 (github-readme-stats), 402 (activity-graph) e nada
# (streak-stats) -- imagem quebrada no perfil e pior que nenhuma.

on:
  schedule:
    # 05:17 UTC, um horario qualquer fora da hora cheia: cron no minuto 0 e
    # onde o GitHub concentra fila e atrasa o disparo.
    - cron: '17 5 * * *'
  workflow_dispatch:

# Sem isto o push do passo final falha com 403.
permissions:
  contents: write

concurrency:
  group: grafico
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Le a pagina publica de contribuicoes: sem token, sem segredo, e mostra
      # exatamente o que um visitante ja ve. O script sai com erro se o HTML do
      # GitHub mudar, para nao commitar um SVG vazio por cima do bom.
      - name: Gerar o SVG
        run: python3 scripts/grafico.py

      - name: Commitar se mudou
        run: |
          if git diff --quiet -- grafico.svg; then
            echo "grafico igual ao do repositorio; nada a fazer"
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add grafico.svg
          git commit -m 'chore: atualiza o grafico de contribuicoes'
          git push
