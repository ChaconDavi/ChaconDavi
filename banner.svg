<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Davi Chacon — desenvolvedor full-stack">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E0B45"/>
      <stop offset="0.45" stop-color="#3B0F87"/>
      <stop offset="1" stop-color="#6D28D9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.12" r="0.7">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.06" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#C4B5FD" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#C4B5FD" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#FFFFFF" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="rounded">
      <rect width="1280" height="340" rx="18"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="1280" height="340" fill="url(#ground)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>
    <rect width="1280" height="340" fill="url(#glow)"/>
    <rect width="1280" height="340" fill="url(#glow2)"/>

    <!-- barra de acento a esquerda: ancora a composicao e ecoa a paleta do README -->
    <rect x="76" y="86" width="5" height="168" rx="2.5" fill="#C4B5FD"/>

    <text x="112" y="112" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="19" font-weight="700" letter-spacing="6.5" fill="#C4B5FD">
      DESENVOLVEDOR FULL-STACK
    </text>

    <text x="108" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="82" font-weight="700" letter-spacing="-2.2" fill="#FFFFFF">
      Davi Chacon
    </text>

    <text x="112" y="246" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="25" font-weight="400" fill="#DDD6FE">
      Sistemas em produção, com gente dependendo deles
    </text>

    <!-- regua fina + stack: a linha inferior da composicao -->
    <rect x="112" y="284" width="46" height="2" rx="1" fill="#A78BFA" fill-opacity="0.9"/>
    <text x="174" y="291" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="17" font-weight="500" letter-spacing="2.4" fill="#B69CFB">
      PHP · TYPESCRIPT · RUBY · KOTLIN · JAVA · PYTHON
    </text>

    <!-- marca d'agua geometrica: circulos concentricos no canto direito -->
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.11">
      <circle cx="1128" cy="170" r="52" stroke-width="1.5"/>
      <circle cx="1128" cy="170" r="86" stroke-width="1.5"/>
      <circle cx="1128" cy="170" r="120" stroke-width="1.5"/>
    </g>
    <circle cx="1128" cy="170" r="20" fill="#C4B5FD" fill-opacity="0.85"/>
  </g>
</svg>
